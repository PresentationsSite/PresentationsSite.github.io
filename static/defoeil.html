<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accommodation de l'œil, défauts de vision et corrections</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --border: #334155;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #f43f5e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 14px;
    overflow-x: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 1220px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #090d16;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .controls-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 22px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }

  .top-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .mode-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn-mode {
    background: #0f172a;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.18s ease;
    user-select: none;
  }

  .btn-mode:hover {
    color: var(--text);
    border-color: var(--muted);
  }

  .btn-mode.active {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
  }

  .btn-glasses {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0f172a;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s ease;
    user-select: none;
  }

  .btn-glasses:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .btn-glasses.active {
    background: rgba(16, 185, 129, 0.16);
    border-color: var(--success);
    color: #fff;
  }

  .btn-glasses:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.2s;
  }

  .btn-glasses.active .indicator {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .bottom-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .slider-container {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #0f172a;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    flex: 1;
  }

  .slider-container label {
    font-size: 0.92rem;
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
  }

  .slider-endpoints {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    min-width: 0;            /* Safari / Firefox : sinon le curseur déborde de sa case */
    height: 6px;
    background: #334155;
    border-radius: 3px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    transition: transform 0.1s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .right-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn-glasses.repos.active {
    background: rgba(245, 158, 11, 0.16);
    border-color: var(--warning);
  }

  .btn-glasses.repos.active .indicator {
    background: var(--warning);
    box-shadow: 0 0 8px var(--warning);
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="canvas-wrapper">
    <canvas id="simCanvas" width="1200" height="675"></canvas>
  </div>

  <div class="controls-panel">
    <div class="top-controls">
      <div class="mode-group">
        <button class="btn-mode active" data-mode="emmetrope">Œil normal (emmétrope)</button>
        <button class="btn-mode" data-mode="myope">Myopie</button>
        <button class="btn-mode" data-mode="hypermetrope">Hypermétropie</button>
        <button class="btn-mode" data-mode="presbyte">Presbytie</button>
      </div>

      <div class="right-buttons">
        <button class="btn-glasses repos" id="btnRepos">
          <span class="indicator"></span>
          <span>Œil au repos (sans accommoder)</span>
        </button>

        <button class="btn-glasses" id="btnGlasses" disabled>
          <span class="indicator"></span>
          <span id="glassesLabel">Placer un verre correcteur</span>
        </button>
      </div>
    </div>

    <div class="bottom-controls">
      <div class="slider-container">
        <label for="distSlider">Position de l'objet :</label>
        <span class="slider-endpoints">Très loin (∞)</span>
        <input type="range" id="distSlider" min="0" max="1000" step="1" value="350">
        <span class="slider-endpoints">Très près</span>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

const modeButtons = document.querySelectorAll('.btn-mode');
const btnGlasses = document.getElementById('btnGlasses');
const btnRepos = document.getElementById('btnRepos');
const glassesLabel = document.getElementById('glassesLabel');
const distSlider = document.getElementById('distSlider');

// Géométrie du banc optique et de l'œil réduit (en pixels).
// Le cristallin (lentille mince équivalente à l'œil) est en x = 670 ;
// la rétine de l'œil normal est à 250 px derrière lui.
const opt = {
  axisY: 350,
  glassesX: 555,
  lensX: 670,
  normalRetinaDist: 250,
  pupilRadius: 68,
  eyeRadiusY: 132
};

const L_VERRE = opt.lensX - opt.glassesX;   // distance verre – cristallin (115 px)

// Les vergences sont en 1/px. L'œil comporte deux éléments convergents :
//   - la cornée, de vergence fixe, qui assure environ les 2/3 de la convergence ;
//   - le cristallin, de vergence réglable (accommodation).
// Chaque œil est décrit par sa longueur (retinaDist, distance cristallin – rétine)
// et par la position de son PR et de son PP, sous la forme des « vergences
// objet » W = 1/d (d : distance de l'objet devant le cristallin ; W < 0 pour un
// PR virtuel, derrière l'œil). On en déduit la plage de vergence du cristallin.
const CORNEE_X = opt.lensX + 14 - 98;          // sommet de la cornée (x = 586)
const E_CORNEE = opt.lensX - CORNEE_X;         // distance cornée – cristallin (84 px)
const V_CORNEE = 1 / 450;                      // vergence de la cornée (fixe)

const AMPLITUDE_NORMALE = 1 / 240;             // PP de l'œil normal à 240 px (« 25 cm »)

const EYE_PROFILES = {
  emmetrope: {
    retinaDist: 250,
    Wfar: 0,                                   // PR à l'infini
    Wnear: AMPLITUDE_NORMALE,                  // PP à 240 px
    glassType: 'none',
    desc: 'Aucun verre nécessaire'
  },
  myope: {
    retinaDist: 280,                           // œil trop long, trop convergent :
    Wfar: 1 / 600,                             // PR à 600 px devant l'œil
    Wnear: 1 / 600 + AMPLITUDE_NORMALE,        // voit très bien de près
    glassType: 'divergent',
    desc: 'Verre correcteur divergent'
  },
  hypermetrope: {
    retinaDist: 212,                           // œil trop court, pas assez convergent :
    Wfar: 1 / 272 - 1 / 212,                   // PR virtuel, derrière l'œil
    Wnear: 1 / 272 - 1 / 212 + AMPLITUDE_NORMALE,
    glassType: 'convergent',
    desc: 'Verre correcteur convergent'
  },
  presbyte: {
    retinaDist: 250,                           // voit bien de loin…
    Wfar: 0,
    Wnear: 1 / 600,                            // …mais le cristallin ne se bombe presque plus : PP à 600 px
    glassType: 'lecture',
    desc: 'Verres de lecture (convergents)'
  }
};

// Propagation d'une vergence P sur une distance t (et opération inverse)
const propager = (P, t) => P / (1 - t * P);
const retropropager = (P, t) => P / (1 + t * P);

// Vergence de la lumière juste avant le cristallin, connaissant sa vergence
// juste avant le verre correcteur (de vergence Vg) : verre, puis cornée.
function vergenceAvantCristallin(Pverre, Vg) {
  let P = propager(Pverre + Vg, L_VERRE - E_CORNEE);
  return propager(P + V_CORNEE, E_CORNEE);
}

// Opération inverse : vergence avant le verre, connaissant celle avant le cristallin
function vergenceAvantVerre(Pcristallin, Vg) {
  const P = retropropager(Pcristallin, E_CORNEE) - V_CORNEE;
  return retropropager(P, L_VERRE - E_CORNEE) - Vg;
}

// Vergence, au niveau du verre, de la lumière issue d'un objet de « vergence objet » W
const vergenceAuVerre = (W) => -W / (1 - L_VERRE * W);

for (const p of Object.values(EYE_PROFILES)) {
  // Vergence du cristallin pour voir net le PR (repos) et le PP (effort maximal)
  const cristallinPour = (W) => 1 / p.retinaDist - vergenceAvantCristallin(vergenceAuVerre(W), 0);
  p.lensMin = cristallinPour(p.Wfar);
  p.lensAmp = cristallinPour(p.Wnear) - p.lensMin;

  // Puissance du verre correcteur, calculée (et non réglée à la main) :
  // - myopie / hypermétropie : l'image d'un objet à l'infini donnée par le verre
  //   doit se former au PR de l'œil, pour qu'il la voie nette sans accommoder ;
  // - presbytie : verre de lecture, qui permet de voir net sans accommoder
  //   un objet placé à 250 px du verre.
  if (p.glassType === 'divergent' || p.glassType === 'convergent') {
    p.glassPower = 1 / (L_VERRE - 1 / p.Wfar);
  } else if (p.glassType === 'lecture') {
    p.glassPower = 1 / 250;
  } else {
    p.glassPower = 0;
  }
}

const state = {
  mode: 'emmetrope',
  hasGlasses: false,
  repos: false,           // accommodation bloquée (œil au repos)
  sliderNorm: 0.35,
  targetSliderNorm: 0.35,

  // Valeurs lissées pour la fluidité
  retinaDist: 250,
  vEye: EYE_PROFILES.emmetrope.lensMin,   // vergence du cristallin
  accommRatio: 0,         // 0 = cristallin au repos, 1 = bombé au maximum
  glassesAnim: 0,
  isDraggingObj: false
};

// Curseur u dans [0, 1] <-> distance objet d (depuis le cristallin) :
// - de 0 à 0,2 : objets hors de l'écran, de « l'infini » (100 000 px) à 660 px ;
// - de 0,2 à 1 : objets sur le banc, de 660 px à 175 px (réglage fin).
const MIN_DO = 175, ECRAN_DO = 660, INFINI_DO = 100000, U_ECRAN = 0.2;

function normToDo(u) {
  if (u < U_ECRAN) return ECRAN_DO * Math.pow(INFINI_DO / ECRAN_DO, (U_ECRAN - u) / U_ECRAN);
  return ECRAN_DO - (u - U_ECRAN) / (1 - U_ECRAN) * (ECRAN_DO - MIN_DO);
}

function doToNorm(d) {
  if (d > ECRAN_DO) return U_ECRAN * (1 - Math.log(d / ECRAN_DO) / Math.log(INFINI_DO / ECRAN_DO));
  return U_ECRAN + (ECRAN_DO - d) / (ECRAN_DO - MIN_DO) * (1 - U_ECRAN);
}

/* ---------- Interface ---------- */

function updateUI() {
  modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === state.mode));

  const profile = EYE_PROFILES[state.mode];
  btnGlasses.disabled = state.mode === 'emmetrope';
  btnGlasses.classList.toggle('active', state.hasGlasses && !btnGlasses.disabled);
  glassesLabel.textContent = profile.desc;
  btnRepos.classList.toggle('active', state.repos);
}

modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    state.mode = btn.dataset.mode;
    state.hasGlasses = false;
    // Place l'objet à une distance révélatrice du défaut choisi
    if (state.mode === 'myope') state.targetSliderNorm = 0;             // objet à l'infini : flou
    else if (state.mode === 'hypermetrope') state.targetSliderNorm = 0; // objet à l'infini : net… en accommodant
    else if (state.mode === 'presbyte') state.targetSliderNorm = 0.76;  // objet proche : flou (net avec verres de lecture)
    distSlider.value = Math.round(state.targetSliderNorm * 1000);
    updateUI();
  });
});

btnGlasses.addEventListener('click', () => {
  if (btnGlasses.disabled) return;
  state.hasGlasses = !state.hasGlasses;
  updateUI();
});

btnRepos.addEventListener('click', () => {
  state.repos = !state.repos;
  updateUI();
});

distSlider.addEventListener('input', (e) => {
  state.targetSliderNorm = parseFloat(e.target.value) / 1000;
});

// Glisser-déposer de l'objet sur le banc
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function surObjet(pos) {
  const objX = opt.lensX - normToDo(state.sliderNorm);
  return objX > 25 && Math.abs(pos.x - objX) < 30 && pos.y > opt.axisY - 90 && pos.y < opt.axisY + 20;
}

canvas.addEventListener('pointerdown', (e) => {
  if (surObjet(getCanvasCoords(e))) {
    state.isDraggingObj = true;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener('pointermove', (e) => {
  const pos = getCanvasCoords(e);
  if (state.isDraggingObj) {
    const x = Math.max(25, Math.min(opt.lensX - MIN_DO, pos.x));
    state.targetSliderNorm = doToNorm(opt.lensX - x);
    distSlider.value = Math.round(state.targetSliderNorm * 1000);
  } else {
    canvas.style.cursor = surObjet(pos) ? 'ew-resize' : 'default';
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (state.isDraggingObj) {
    state.isDraggingObj = false;
    canvas.releasePointerCapture(e.pointerId);
  }
});

/* ---------- Optique ---------- */

// Hauteur de l'objet : 40 px sur le banc, avec un diamètre apparent minimal
// (tan α = 0,09) pour qu'un objet lointain ait toujours une image visible.
const objHeight = (d) => Math.max(40, 0.09 * d);

// Vergence effective du verre (animée à la pose / au retrait)
function vergenceVerre() {
  const p = EYE_PROFILES[state.mode];
  return (state.mode === 'emmetrope' ? 0 : p.glassPower) * state.glassesAnim;
}

// Vergence de la lumière issue d'un objet à la distance d, juste avant le cristallin
const vergenceObjet = (d, V) => vergenceAvantCristallin(-1 / Math.max(30, d - L_VERRE), V);

// Distance de l'objet vu net quand le cristallin a la vergence Vl
// (Infinity s'il n'existe aucun objet réel vu net).
function distanceObjetPourCristallin(Vl, D, V) {
  const P0 = vergenceAvantVerre(1 / D - Vl, V);
  return P0 >= -1e-12 ? Infinity : L_VERRE - 1 / P0;
}

// Ellipse de la rétine (dépend de la longueur de l'œil)
function retine() {
  const D = state.retinaDist;
  const rx = D * 0.58;
  const cx = opt.lensX + D - rx;
  return { cx, cy: opt.axisY, rx: rx - 3, ry: opt.eyeRadiusY - 3, globe: { cx, rx } };
}

// Point où un rayon issu de (x0, y0), de pente m, atteint la surface de la cornée
// (cercle de centre (lensX + 14, axe) et de rayon 98, face avant)
function impactCornee(x0, y0, m) {
  const cxC = opt.lensX + 14, rC = 98;
  const a = 1 + m * m;
  const b = 2 * (x0 - cxC) + 2 * m * (y0 - opt.axisY);
  const c = (x0 - cxC) ** 2 + (y0 - opt.axisY) ** 2 - rC * rC;
  const t = (-b - Math.sqrt(Math.max(0, b * b - 4 * a * c))) / (2 * a);
  return { x: x0 + t, y: y0 + m * t };
}

// Intersection d'un rayon issu de (x0, y0), de pente m, avec la rétine (vers l'arrière)
function impactRetine(x0, y0, m, R) {
  const a = 1 / (R.rx * R.rx) + (m * m) / (R.ry * R.ry);
  const b = 2 * (x0 - R.cx) / (R.rx * R.rx) + 2 * m * (y0 - R.cy) / (R.ry * R.ry);
  const c = ((x0 - R.cx) ** 2) / (R.rx * R.rx) + ((y0 - R.cy) ** 2) / (R.ry * R.ry) - 1;
  const t = (-b + Math.sqrt(Math.max(0, b * b - 4 * a * c))) / (2 * a);
  return { x: x0 + t, y: y0 + m * t };
}

// Trajet d'un rayon issu de la source (hauteur dySrc par rapport à l'axe), dévié
// par le verre puis par la cornée, et frappant le cristallin à la hauteur dyLens.
function tracerRayon(d, dySrc, dyLens, V) {
  const dov = Math.max(30, d - L_VERRE);
  const parcours = (s0) => {
    const yg = dySrc + s0 * dov;                    // sur le verre
    const s1 = s0 - V * yg;
    const yc = yg + s1 * (L_VERRE - E_CORNEE);      // sur la cornée
    const s2 = s1 - V_CORNEE * yc;
    return { yg, s1, s2, yl: yc + s2 * E_CORNEE };  // sur le cristallin
  };
  // Le trajet est affine en la pente initiale s0 : on la choisit pour atteindre dyLens
  const a = parcours(0), b = parcours(1);
  const s0 = (dyLens - a.yl) / (b.yl - a.yl);
  const r = parcours(s0);
  return {
    dyGlass: r.yg,
    pente1: s0,                                      // avant le verre
    pente2: r.s1,                                    // entre le verre et la cornée
    penteSortie: r.s2 - state.vEye * dyLens          // après le cristallin
  };
}

function computeOpticalState() {
  const profile = EYE_PROFILES[state.mode];
  const d_o = normToDo(state.sliderNorm);
  const objX = opt.lensX - d_o;
  const objH = objHeight(d_o);
  const V_glass = vergenceVerre();
  const R = retine();

  // Accommodation réflexe : vergence du cristallin idéale pour une image nette
  // sur la rétine, limitée à la plage de l'œil (ou bloquée au repos).
  const P_avant = vergenceObjet(d_o, V_glass);      // lumière arrivant sur le cristallin
  const V_req = 1 / state.retinaDist - P_avant;
  const lensMax = profile.lensMin + profile.lensAmp;
  const V_eye_actual = state.repos ? profile.lensMin : Math.max(profile.lensMin, Math.min(lensMax, V_req));
  const targetAccommRatio = (V_eye_actual - profile.lensMin) / profile.lensAmp;

  // Point de convergence des rayons (image A'B') derrière le cristallin
  const P_apres = P_avant + state.vEye;
  const d_i_eye = P_apres > 1e-6 ? 1 / P_apres : 5000;
  const focusX = opt.lensX + d_i_eye;

  // Tache de flou sur la rétine : écart entre les rayons extrêmes issus de A
  const pup = opt.pupilRadius * 0.86;
  const hit = (dyLens) => {
    const r = tracerRayon(d_o, 0, dyLens, V_glass);
    return impactRetine(opt.lensX, opt.axisY + dyLens, r.penteSortie, R);
  };
  const blurDiam = Math.abs(hit(pup).y - hit(-pup).y);

  // B' : rayon issu de B passant par le centre du cristallin
  const rb = tracerRayon(d_o, -objH, 0, V_glass);
  const Bp = impactRetine(opt.lensX, opt.axisY, rb.penteSortie, R);

  // Zone de vision nette (objets entre PP et PR), compte tenu du verre
  const infini = (d) => d > 1e6 ? Infinity : d;
  const zone = {
    far: infini(distanceObjetPourCristallin(profile.lensMin, profile.retinaDist, V_glass)),
    near: infini(distanceObjetPourCristallin(state.repos ? profile.lensMin : lensMax, profile.retinaDist, V_glass))
  };

  // Demi-hauteur du verre : assez grande pour que tous les rayons tracés le traversent
  let yVerreMax = 0;
  for (const [dy, f] of [[0, 0.86], [-objH, 0.85]]) {
    for (const s of [-1, 1]) {
      yVerreMax = Math.max(yVerreMax, Math.abs(tracerRayon(d_o, dy, s * f * opt.pupilRadius, V_glass).dyGlass));
    }
  }
  const glassHalfH = Math.min(220, Math.max(92, yVerreMax + 12));

  return {
    profile, d_o, objX, objH, V_glass, R, V_eye_actual, targetAccommRatio, glassHalfH,
    d_i_eye, focusX, blurDiam, Bp, zone,
    isSharp: blurDiam < 3,
    imageAvant: d_i_eye < state.retinaDist
  };
}

/* ---------- Dessin ---------- */

function drawArrowHead(x, y, ux, uy, color, size = 6.5) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(uy, ux));
  ctx.beginPath();
  ctx.moveTo(2, 0);
  ctx.lineTo(-size, -size * 0.58);
  ctx.lineTo(-size * 0.7, 0);
  ctx.lineTo(-size, size * 0.58);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Interpolation de couleurs « #rrggbb »
function melange(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
  return `rgb(${ch(16)}, ${ch(8)}, ${ch(0)})`;
}

// Couleur d'effort : gris (repos) -> ambre -> rouge (effort maximal)
const couleurEffort = (t) => t < 0.5 ? melange('#64748b', '#f59e0b', t * 2) : melange('#f59e0b', '#f43f5e', (t - 0.5) * 2);

function drawEyeAnatomy(sim) {
  const lensX = opt.lensX;
  const cy = opt.axisY;
  const R = sim.R;
  const ry = opt.eyeRadiusY;

  ctx.save();

  // 1. Rétine d'un œil normal, en pointillés (myope, hypermétrope)
  if (Math.abs(state.retinaDist - opt.normalRetinaDist) > 2) {
    const rxN = opt.normalRetinaDist * 0.58;
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.ellipse(lensX + opt.normalRetinaDist - rxN, cy, rxN - 3, ry - 3, 0, -0.55, 0.55);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 2. Globe oculaire (humeur vitrée)
  ctx.beginPath();
  ctx.ellipse(R.globe.cx, cy, R.globe.rx, ry, 0, 0, Math.PI * 2);
  const vitreousGrad = ctx.createRadialGradient(R.globe.cx, cy, 10, R.globe.cx, cy, R.globe.rx);
  vitreousGrad.addColorStop(0, 'rgba(15, 23, 42, 0.85)');
  vitreousGrad.addColorStop(1, 'rgba(30, 41, 59, 0.55)');
  ctx.fillStyle = vitreousGrad;
  ctx.fill();
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 3.5;
  ctx.stroke();

  // 3. Rétine
  ctx.strokeStyle = '#fb7185';
  ctx.lineWidth = 4.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.ellipse(R.cx, cy, R.rx, R.ry, 0, -0.68 * Math.PI, 0.68 * Math.PI);
  ctx.stroke();

  ctx.fillStyle = '#fb7185';
  ctx.font = '600 14px "Avenir Next", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Rétine', R.cx + R.rx + 12, cy - 35);

  // 4. Cornée
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(lensX + 14, cy, 98, 0.65 * Math.PI, 1.35 * Math.PI);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '600 13px "Avenir Next", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('cornée', lensX - 36, cy - 96);

  // 5. Muscles ciliaires : ils « s'allument » quand ils travaillent
  const lensHalfH = 78;
  const effort = state.accommRatio;
  const coul = couleurEffort(effort);
  ctx.save();
  ctx.strokeStyle = coul;
  ctx.lineWidth = 4 + 5 * effort;
  ctx.shadowColor = coul;
  ctx.shadowBlur = 4 + 22 * effort;
  ctx.beginPath();
  ctx.moveTo(lensX, cy - 104);
  ctx.lineTo(lensX, cy - lensHalfH);
  ctx.moveTo(lensX, cy + 104);
  ctx.lineTo(lensX, cy + lensHalfH);
  ctx.stroke();
  ctx.restore();

  if (effort > 0.04) {
    ctx.fillStyle = coul;
    ctx.font = '600 13px "Avenir Next", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('muscles ciliaires', lensX, cy - 126);
  }

  // 6. Iris
  const irisX = lensX - 18;
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(irisX, cy - 94);
  ctx.lineTo(irisX, cy - opt.pupilRadius);
  ctx.moveTo(irisX, cy + opt.pupilRadius);
  ctx.lineTo(irisX, cy + 94);
  ctx.stroke();

  // 7. Cristallin, plus bombé quand l'œil accommode
  const halfThick = 13 + 18 * effort;
  const Rl = (lensHalfH * lensHalfH + halfThick * halfThick) / (2 * halfThick);
  const C1x = (lensX - halfThick) + Rl;
  const C2x = (lensX + halfThick) - Rl;
  const maxAngle = Math.asin(lensHalfH / Rl);

  ctx.beginPath();
  ctx.arc(C1x, cy, Rl, Math.PI + maxAngle, Math.PI - maxAngle, true);
  ctx.arc(C2x, cy, Rl, maxAngle, -maxAngle, true);
  ctx.closePath();
  const lensGrad = ctx.createLinearGradient(lensX - halfThick, cy - lensHalfH, lensX + halfThick, cy + lensHalfH);
  lensGrad.addColorStop(0, 'rgba(56, 189, 248, 0.25)');
  lensGrad.addColorStop(0.5, 'rgba(224, 242, 254, 0.52)');
  lensGrad.addColorStop(1, 'rgba(14, 165, 233, 0.30)');
  ctx.fillStyle = lensGrad;
  ctx.fill();
  ctx.strokeStyle = '#bae6fd';
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.fillStyle = '#bae6fd';
  ctx.font = '600 13px "Avenir Next", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('cristallin', lensX, cy + 124);

  // Légende : rôle de chacun dans la convergence
  ctx.font = '500 14px "Avenir Next", sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('La cornée (fixe) assure environ 2/3 de la convergence ;', lensX + 110, cy + 168);
  ctx.fillText('le cristallin (réglable) fait la mise au point : c\'est l\'accommodation.', lensX + 110, cy + 188);

  ctx.restore();
}

// Verre correcteur : biconcave (divergent) ou biconvexe (convergent)
function drawCorrectiveGlass(sim) {
  if (state.glassesAnim <= 0.01 || state.mode === 'emmetrope') return;

  const gx = opt.glassesX;
  const cy = opt.axisY;
  const halfH = sim.glassHalfH;

  ctx.save();
  ctx.globalAlpha = state.glassesAnim;

  const grad = ctx.createLinearGradient(gx - 18, cy - halfH, gx + 18, cy + halfH);
  grad.addColorStop(0, 'rgba(125, 211, 252, 0.22)');
  grad.addColorStop(0.5, 'rgba(224, 242, 254, 0.45)');
  grad.addColorStop(1, 'rgba(56, 189, 248, 0.25)');
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#7dd3fc';
  ctx.lineWidth = 2;

  ctx.beginPath();
  if (sim.profile.glassType === 'divergent') {
    const edgeW = 14, centerW = 5;
    ctx.moveTo(gx - edgeW, cy - halfH);
    ctx.lineTo(gx + edgeW, cy - halfH);
    ctx.quadraticCurveTo(gx + centerW, cy, gx + edgeW, cy + halfH);
    ctx.lineTo(gx - edgeW, cy + halfH);
    ctx.quadraticCurveTo(gx - centerW, cy, gx - edgeW, cy - halfH);
  } else {
    // Plus bombé pour les verres de lecture, plus puissants
    const centerW = sim.profile.glassType === 'lecture' ? 26 : 16;
    ctx.moveTo(gx, cy - halfH);
    ctx.quadraticCurveTo(gx + centerW, cy, gx, cy + halfH);
    ctx.quadraticCurveTo(gx - centerW, cy, gx, cy - halfH);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// Faisceaux issus de A (ambre) et de B (rose), arrêtés sur la rétine courbe ;
// prolongés en pointillés quand ils convergent en arrière de la rétine.
function drawLightBundles(sim) {
  const { d_o, objX, objH, V_glass, R } = sim;
  const maxPupil = opt.pupilRadius * 0.86;

  const bundles = [
    {
      dySrc: 0,
      colorIncident: 'rgba(251, 191, 36, 0.72)',
      colorRefracted: 'rgba(253, 224, 71, 0.88)',
      arrowColor: '#fbbf24',
      rayFractions: [-1, -0.5, 0, 0.5, 1]
    },
    {
      dySrc: -objH,
      colorIncident: 'rgba(244, 63, 94, 0.55)',
      colorRefracted: 'rgba(251, 113, 133, 0.75)',
      arrowColor: '#fb7185',
      rayFractions: [-0.85, 0, 0.85]
    }
  ];

  ctx.save();
  for (const b of bundles) {
    for (const frac of b.rayFractions) {
      const dyLens = frac * maxPupil;
      const yLens = opt.axisY + dyLens;
      const r = tracerRayon(d_o, b.dySrc, dyLens, V_glass);
      const yGlass = opt.axisY + r.dyGlass;

      // 1. Source -> verre (depuis l'objet, ou le bord gauche s'il est hors champ)
      const startX = Math.max(0, objX);
      const startY = yGlass - (opt.glassesX - startX) * r.pente1;
      ctx.strokeStyle = b.colorIncident;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(opt.glassesX, yGlass);
      ctx.stroke();

      if (opt.glassesX - startX > 80) {
        const n1 = Math.hypot(1, r.pente1);
        drawArrowHead(startX + 0.55 * (opt.glassesX - startX), startY + 0.55 * (yGlass - startY),
                      1 / n1, r.pente1 / n1, b.arrowColor, 6);
      }

      // 2. Verre -> cornée (déviation sur sa surface courbe) -> cristallin
      const C = impactCornee(opt.glassesX, yGlass, r.pente2);
      ctx.beginPath();
      ctx.moveTo(opt.glassesX, yGlass);
      ctx.lineTo(C.x, C.y);
      ctx.lineTo(opt.lensX, yLens);
      ctx.stroke();

      // 3. Cristallin -> rétine (le rayon s'arrête sur la rétine courbe)
      const P = impactRetine(opt.lensX, yLens, r.penteSortie, R);
      ctx.strokeStyle = b.colorRefracted;
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(opt.lensX, yLens);
      ctx.lineTo(P.x, P.y);
      ctx.stroke();

      // 4. Convergence en arrière de la rétine : prolongement en pointillés
      if (sim.focusX > P.x + 3) {
        const endX = Math.min(canvas.width - 20, sim.focusX + 15);
        ctx.save();
        ctx.strokeStyle = b.colorRefracted;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(P.x, P.y);
        ctx.lineTo(endX, yLens + r.penteSortie * (endX - opt.lensX));
        ctx.stroke();
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

// Image A'B' tracée le long de la rétine (renversée), plus large et plus pâle si floue
function drawRetinalImage(sim) {
  const R = sim.R;
  const angleB = Math.atan2((sim.Bp.y - R.cy) / R.ry, (sim.Bp.x - R.cx) / R.rx);
  const flou = Math.min(1, sim.blurDiam / 30);
  const largeur = 3.5 + 9 * flou;

  ctx.save();
  ctx.lineCap = 'round';

  // Liseré sombre pour détacher l'image de la rétine
  ctx.strokeStyle = 'rgba(9, 13, 22, 0.95)';
  ctx.lineWidth = largeur + 5;
  ctx.beginPath();
  ctx.ellipse(R.cx, R.cy, R.rx, R.ry, 0, 0, angleB, angleB < 0);
  ctx.stroke();

  ctx.strokeStyle = `rgba(224, 242, 254, ${1 - 0.6 * flou})`;
  ctx.shadowColor = '#e0f2fe';
  ctx.shadowBlur = 6 + 18 * flou;
  ctx.lineWidth = largeur;
  ctx.beginPath();
  ctx.ellipse(R.cx, R.cy, R.rx, R.ry, 0, 0, angleB, angleB < 0);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Pointe en B' (tangente à la rétine)
  if (flou < 0.8) {
    const s = Math.sign(angleB) || 1;
    drawArrowHead(sim.Bp.x, sim.Bp.y, -R.rx * Math.sin(angleB) * s, R.ry * Math.cos(angleB) * s, '#e0f2fe', 8);
  }

  // A' sur l'axe
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(R.cx + R.rx, R.cy, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = '600 15px "Avenir Next", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e0f2fe';
  ctx.fillText("A'", R.cx + R.rx + 10, R.cy - 8);
  ctx.fillText("B'", sim.Bp.x + 10, sim.Bp.y + 12);
  ctx.restore();
}

// Zone de vision nette (entre PP et PR) sous l'axe
function drawZoneNette(sim) {
  const xMin = 0, xMax = opt.lensX - MIN_DO;
  const xOf = (d) => d === Infinity ? -Infinity : opt.lensX - d;
  let xFar = xOf(sim.zone.far), xNear = xOf(sim.zone.near);
  if (xNear < xMin && xFar < xMin) return;          // zone entièrement hors champ, à gauche
  const y = opt.axisY + 96;

  ctx.save();
  ctx.font = '600 13px "Avenir Next", sans-serif';
  ctx.textAlign = 'center';

  const x1 = Math.max(xMin, xFar), x2 = Math.min(xMax, xNear);
  if (x2 - x1 > 2) {
    ctx.fillStyle = 'rgba(16, 185, 129, 0.22)';
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(x1, y - 5, x2 - x1, 10, 5);
    ctx.fill();
    ctx.stroke();
    // Légende sous la bande, si elle ne gêne pas la mention « jusqu'à l'infini »
    const debutLibre = xFar < xMin ? 150 : 0;
    if (x2 - x1 > 150 && (x1 + x2) / 2 - 75 > debutLibre) {
      ctx.fillStyle = '#34d399';
      ctx.fillText('zone de vision nette', (x1 + x2) / 2, y + 24);
    }
  }

  const repere = (x, texte) => {
    ctx.fillStyle = '#34d399';
    ctx.strokeStyle = '#34d399';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y - 10);
    ctx.lineTo(x, y + 10);
    ctx.stroke();
    ctx.fillText(texte, x, y - 15);
  };
  if (xFar >= xMin && xFar <= xMax) repere(xFar, 'PR');
  else if (xFar < xMin && x2 > xMin) {
    ctx.fillStyle = '#34d399';
    ctx.textAlign = 'left';
    ctx.fillText(sim.zone.far === Infinity ? '← jusqu\'à l\'infini' : '← PR plus loin', 6, y + 24);
    ctx.textAlign = 'center';
  }
  if (xNear >= xMin && xNear <= xMax && Math.abs(xNear - xFar) > 1) repere(xNear, 'PP');
  ctx.restore();
}

function drawObjectAndRetinalPreview(sim) {
  const { objX, objH } = sim;
  const yB = opt.axisY - objH;

  ctx.save();

  // 1. Objet AB sur le banc, ou indication d'un objet très éloigné
  if (objX >= 25) {
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(objX, opt.axisY);
    ctx.lineTo(objX, yB);
    ctx.stroke();
    drawArrowHead(objX, yB, 0, -1, '#fb7185', 9);

    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(objX, opt.axisY, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f8fafc';
    ctx.font = '600 18px "Avenir Next", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('A', objX, opt.axisY + 24);
    ctx.fillStyle = '#fb7185';
    ctx.fillText('B', objX, yB - 12);
  } else {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(18, opt.axisY + 24, 215, 34, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '500 14px "Avenir Next", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(sim.d_o > 50000 ? '← Objet à l\'infini' : '← Objet très éloigné', 30, opt.axisY + 46);
  }

  // 2. Tableau de bord (à droite de l'œil)
  const cardW = 222;
  const cardH = 262;
  const cardX = canvas.width - cardW - 16;
  const cardY = 16;

  ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cardW, cardH, 12);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '600 13px "Avenir Next", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('IMAGE SUR LA RÉTINE', cardX + cardW / 2, cardY + 22);

  // Médaillon : ce que « voit » la rétine (flèche renversée, floutée)
  const viewCX = cardX + cardW / 2;
  const viewCY = cardY + 84;
  const viewR = 50;

  ctx.save();
  ctx.beginPath();
  ctx.arc(viewCX, viewCY, viewR, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = '#090d16';
  ctx.fillRect(viewCX - viewR, viewCY - viewR, viewR * 2, viewR * 2);

  const numSamples = 28;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  const spread = Math.min(26, sim.blurDiam * 0.6);
  const net = spread < 0.8;
  for (let i = 0; i < (net ? 1 : numSamples); i++) {
    const r = net ? 0 : Math.sqrt((i + 0.5) / numSamples) * spread;
    const a = i * goldenAngle;
    ctx.save();
    ctx.globalAlpha = net ? 1 : 1.5 / numSamples;
    ctx.translate(viewCX + r * Math.cos(a), viewCY + r * Math.sin(a));
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, -26);
    ctx.lineTo(0, 24);
    ctx.stroke();
    drawArrowHead(0, 26, 0, 1, '#fb7185', 10);
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, -26, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  ctx.strokeStyle = sim.isSharp ? '#10b981' : '#f43f5e';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(viewCX, viewCY, viewR, 0, Math.PI * 2);
  ctx.stroke();

  // Verdict de netteté
  ctx.font = '600 14px "Avenir Next", sans-serif';
  ctx.fillStyle = sim.isSharp ? '#34d399' : '#fb7185';
  const statut = sim.isSharp ? 'Vision nette'
    : (sim.imageAvant ? 'Flou : image avant la rétine' : 'Flou : image après la rétine');
  ctx.fillText(statut, cardX + cardW / 2, cardY + 156);

  // Message complémentaire
  const loin = sim.d_o > 5000;
  let message = '';
  if (state.mode === 'hypermetrope' && !state.hasGlasses && sim.isSharp && loin && state.accommRatio > 0.05) {
    message = ['Net… mais en accommodant :', 'l\'œil travaille même de loin !'];
  } else if (state.mode === 'hypermetrope' && !state.hasGlasses && state.repos && loin) {
    message = ['Au repos, l\'image d\'un objet', 'lointain se forme après la rétine'];
  } else if (state.mode === 'presbyte' && state.hasGlasses && !sim.isSharp && loin) {
    message = ['Verres de lecture : flou de loin', '(d\'où les verres progressifs)'];
  } else if (state.mode === 'myope' && !state.hasGlasses && !sim.isSharp && sim.imageAvant) {
    message = ['Objet au-delà du PR : même au repos,', 'l\'œil est trop convergent'];
  } else if (!sim.isSharp && !sim.imageAvant && !state.repos && state.accommRatio > 0.97) {
    message = ['Objet plus proche que le PP :', 'accommodation maximale atteinte'];
  }
  if (message) {
    ctx.font = '500 12.5px "Avenir Next", sans-serif';
    ctx.fillStyle = '#fbbf24';
    ctx.fillText(message[0], cardX + cardW / 2, cardY + 178);
    ctx.fillText(message[1], cardX + cardW / 2, cardY + 194);
  }

  // Jauge d'effort d'accommodation
  const effort = state.accommRatio;
  const pct = Math.round(effort * 100);
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '600 13px "Avenir Next", sans-serif';
  ctx.fillText(state.repos ? 'Accommodation bloquée (repos)' : `Effort d'accommodation : ${pct} %`,
               cardX + cardW / 2, cardY + 222);

  const gx = cardX + 18, gw = cardW - 36, gy = cardY + 232, gh = 12;
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.roundRect(gx, gy, gw, gh, 6);
  ctx.fill();
  if (effort > 0.005) {
    ctx.fillStyle = couleurEffort(effort);
    ctx.shadowColor = couleurEffort(effort);
    ctx.shadowBlur = 8 * effort;
    ctx.beginPath();
    ctx.roundRect(gx, gy, Math.max(gh, gw * effort), gh, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function animate() {
  state.sliderNorm += (state.targetSliderNorm - state.sliderNorm) * 0.18;

  const profile = EYE_PROFILES[state.mode];
  state.retinaDist += (profile.retinaDist - state.retinaDist) * 0.15;

  const targetGlasses = (state.hasGlasses && state.mode !== 'emmetrope') ? 1 : 0;
  state.glassesAnim += (targetGlasses - state.glassesAnim) * 0.16;

  const sim = computeOpticalState();
  state.vEye += (sim.V_eye_actual - state.vEye) * 0.22;
  state.accommRatio += (sim.targetAccommRatio - state.accommRatio) * 0.18;

  // Recalcul avec les valeurs lissées pour une cohérence géométrique parfaite
  const finalSim = computeOpticalState();

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Axe optique
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(0, opt.axisY);
  ctx.lineTo(canvas.width, opt.axisY);
  ctx.stroke();
  ctx.setLineDash([]);

  drawZoneNette(finalSim);
  drawEyeAnatomy(finalSim);
  drawCorrectiveGlass(finalSim);
  drawLightBundles(finalSim);
  drawRetinalImage(finalSim);
  drawObjectAndRetinalPreview(finalSim);

  requestAnimationFrame(animate);
}

updateUI();
requestAnimationFrame(animate);
</script>
