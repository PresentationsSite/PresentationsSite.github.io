<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Carte des Centrales Nucléaires</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #191919; }
        #map { height: 100vh; width: 100vw; }
        .legend { 
            background: rgba(40, 40, 40, 0.9); 
            color: white; 
            padding: 10px; border-radius: 5px; 
            font-family: sans-serif; font-size: 12px;
        }
        .legend i { width: 12px; height: 12px; float: left; margin-right: 8px; border-radius: 50%; margin-top: 3px;}
        .leaflet-tile-pane,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', { preferCanvas: true }).setView([20, 10], 3);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    function getStatusColor(id) {
        switch(id) {
            case 3: return '#2ecc71'; // Opérationnel
            case 2: return '#f39c12'; // En construction
            case 5: return '#e74c3c'; // Fermé
            default: return '#3498db'; // Autre / Planifié
        }
    }

    function getSiteName(name) {
        const base = name.split('(')[0].trim();
        // Retire les suffixes de tranche (-1, -2, -A1, -B2, -A, -2-1...) tout en gardant les noms composés (ex: Super-Phenix)
        const match = base.match(/^(.{3,}?)-(?:[A-Z]?\d+|[A-Z])(?:-\d+)?$/);
        if (match) return match[1].trim();
        const paren = name.match(/\(([^)]+)\)/);
        if (paren && base.length <= 4) return paren[1].trim();
        return base;
    }

    function getStatusPriority(statusId) {
        if (statusId === 3) return 4; // Opérationnel
        if (statusId === 2) return 3; // En construction
        if (statusId === 5) return 2; // Arrêté / Déclassé
        return 1;                     // Autre / Planifié
    }

    fetch('/data/reactors.json')
        .then(res => res.json())
        .then(data => {
            const sites = {};

            // Étape 1 : Regroupement des réacteurs par site
            data.forEach(r => {
                if (!r.Latitude || !r.Longitude) return;

                const siteName = getSiteName(r.Name);
                const siteKey = `${r.CountryCode || ''}_${siteName}`;
                
                if (!sites[siteKey]) {
                    sites[siteKey] = {
                        name: siteName,
                        lat: r.Latitude,
                        lng: r.Longitude,
                        statusId: r.StatusId,
                        reactors: []
                    };
                }

                sites[siteKey].reactors.push(r);

                if (getStatusPriority(r.StatusId) > getStatusPriority(sites[siteKey].statusId)) {
                    sites[siteKey].statusId = r.StatusId;
                }
            });

            // Étape 2 : Affichage des sites sur la carte (en ne comptant que les réacteurs du statut dominant du site)
            Object.values(sites).forEach(site => {
                const relevantReactors = site.reactors.filter(r => r.StatusId === site.statusId);
                const unitCount = relevantReactors.length;
                const totalCapacity = relevantReactors.reduce((sum, r) => sum + (r.Capacity || 0), 0);
                const model = relevantReactors.find(r => r.ReactorModel)?.ReactorModel;

                L.circleMarker([site.lat, site.lng], {
                    radius: 6 + (unitCount * 0.5), // Le cercle est légèrement plus gros s'il y a beaucoup de réacteurs
                    fillColor: getStatusColor(site.statusId),
                    color: "#000",
                    weight: 1,
                    fillOpacity: 0.8
                }).addTo(map)
                  .bindPopup(`
                    <div style="color:#333; font-family: sans-serif;">
                        <h3 style="margin:0 0 5px 0">${site.name}</h3>
                        <b>Nombre de réacteurs :</b> ${unitCount}<br>
                        <b>Capacité totale :</b> ${totalCapacity.toLocaleString()} MW<br>
                        <b>Type dominant :</b> ${model || 'N/A'}
                    </div>
                  `);
            });
        });

    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = `
            <i style="background: #2ecc71"></i> Opérationnel<br>
            <i style="background: #f39c12"></i> En construction<br>
            <i style="background: #e74c3c"></i> Arrêté / Déclassé<br>
            <i style="background: #3498db"></i> Autre / Planifié
        `;
        return div;
    };
    legend.addTo(map);
</script>
</body>
</html>
