<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double réfraction dans une lentille biconvexe symétrique</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f8fafc;
    --border: #334155;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    overflow: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 1200px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #090d16;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
<link rel="stylesheet" href="css/anim-mobile.css">
<script src="js/anim-mobile.js"></script>
</head>
<body>

<div class="app-container">
  <div class="canvas-wrapper">
    <canvas id="simCanvas" width="1200" height="675"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// Géométrie symétrique de la lentille biconvexe (en fuseau parfait, sans rebords)
const lensCenterX = 600;
const axisY = 337.5;

const R = 360;            // Rayon de courbure des deux dioptres sphériques
const halfThick = 80;     // Demi-épaisseur au centre (épaisseur totale = 160 px)

// Centres de courbure C1 (à droite pour la face gauche) et C2 (à gauche pour la face droite)
// Sommets de la lentille : V1 = 600 - 80 = 520, V2 = 600 + 80 = 680
const C1x = (lensCenterX - halfThick) + R; // 880
const C2x = (lensCenterX + halfThick) - R; // 320

// Demi-hauteur exacte où les deux arcs de cercle se croisent en pointe (à x = lensCenterX)
// (lensCenterX - C1x)^2 + H^2 = R^2  =>  (R - halfThick)^2 + H^2 = R^2
const halfHeight = Math.sqrt(R * R - (R - halfThick) * (R - halfThick)); // ~ 226.3 px

// Angle d'ouverture des arcs de cercle pour le tracé natif de la lentille
const maxAngle = Math.asin(halfHeight / R);

// Points conjugués symétriques A et A'
const A = { x: 110, y: axisY };
const Ap = { x: 1090, y: axisY };
const nGlass = 1.52;

// Calcul d'un rayon à la hauteur relative yRel :
// Dans une configuration symétrique 2f - 2f (A et A' symétriques par rapport à une lentille biconvexe symétrique),
// tout rayon issu de A est réfracté au premier dioptre (en P1) parallèlement à l'axe optique,
// traverse le verre horizontalement, puis subit une réfraction symétrique au second dioptre (en P2) pour converger en A'.
function computeSymmetricalRay(yRel) {
  const y = axisY + yRel;
  const dx = Math.sqrt(R * R - yRel * yRel);

  // Points d'impact sur le dioptre d'entrée (P1) et le dioptre de sortie (P2)
  const P1 = { x: C1x - dx, y };
  const P2 = { x: C2x + dx, y };

  // Normales unitaires exactes aux dioptres sphériques en P1 et P2 (orientées dans le sens de la lumière)
  const N1 = { x: (C1x - P1.x) / R, y: -yRel / R };
  const N2 = { x: (P2.x - C2x) / R, y: yRel / R };

  // Segment 1 : Air (de A à P1)
  const dx1 = P1.x - A.x;
  const dy1 = P1.y - A.y;
  const L1 = Math.hypot(dx1, dy1);
  const u1 = { x: dx1 / L1, y: dy1 / L1 };

  // Segment 2 : Verre (de P1 à P2, trajet horizontal symétrique)
  const L2 = P2.x - P1.x;
  const u2 = { x: 1, y: 0 };

  // Segment 3 : Air (de P2 à A')
  const dx3 = Ap.x - P2.x;
  const dy3 = Ap.y - P2.y;
  const L3 = Math.hypot(dx3, dy3);
  const u3 = { x: dx3 / L3, y: dy3 / L3 };

  // Temps de vol en unités de chemin optique (vitesse c = 1 dans l'air, v = 1/n dans le verre)
  const t1 = L1;
  const t2 = L1 + nGlass * L2;
  const t3 = t2 + L3;

  return { P1, P2, N1, N2, u1, u2, u3, L1, L2, L3, t1, t2, t3 };
}

// Sélection des 7 rayons représentés (répartis sur la hauteur de la lentille)
const rayHeights = [-180, -120, -60, 0, 60, 120, 180];
const rays = rayHeights.map(h => computeSymmetricalRay(h));

// Chemin optique maximal pour caler le cycle d'animation
const maxOPL = Math.max(...rays.map(r => r.t3));
const opticalSpeed = 145; // Vitesse très ralentie pour bien observer les deux réfractions
const pauseAtEnd = 3.2;   // Pause finale une fois les rayons arrivés en A'
const totalCycleTime = (maxOPL / opticalSpeed) + pauseAtEnd;

let startTime = null;

// Dessin de la vraie lentille biconvexe symétrique (deux arcs de cercle joints aux pointes)
function drawLensBody() {
  ctx.save();

  ctx.beginPath();
  // Arc gauche (centré en C1, de la pointe haute vers la pointe basse)
  ctx.arc(C1x, axisY, R, Math.PI + maxAngle, Math.PI - maxAngle, true);
  // Arc droit (centré en C2, de la pointe basse vers la pointe haute)
  ctx.arc(C2x, axisY, R, maxAngle, -maxAngle, true);
  ctx.closePath();

  // Dégradé verre optique
  const grad = ctx.createLinearGradient(
    lensCenterX - halfThick, axisY - halfHeight,
    lensCenterX + halfThick, axisY + halfHeight
  );
  grad.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
  grad.addColorStop(0.5, 'rgba(186, 230, 253, 0.28)');
  grad.addColorStop(1, 'rgba(14, 165, 233, 0.18)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Contour net de la lentille
  ctx.strokeStyle = 'rgba(186, 230, 253, 0.8)';
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.restore();
}

// Dessin d'une normale au dioptre en pointillés
function drawNormal(pt, normalVec, alpha, isAxisRay) {
  if (alpha <= 0.01 || isAxisRay) return;

  const halfLen = 64;
  const x1 = pt.x - normalVec.x * halfLen;
  const y1 = pt.y - normalVec.y * halfLen;
  const x2 = pt.x + normalVec.x * halfLen;
  const y2 = pt.y + normalVec.y * halfLen;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Petit point d'impact sur le dioptre
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 2.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Flèche directionnelle sur un rayon
function drawArrowHead(x, y, ux, uy, color) {
  const size = 7;
  ctx.save();
  ctx.fillStyle = color;
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(uy, ux));
  ctx.beginPath();
  ctx.moveTo(2, 0);
  ctx.lineTo(-size, -size * 0.58);
  ctx.lineTo(-size * 0.7, 0);
  ctx.lineTo(-size, size * 0.58);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Tracé progressif des rayons et des normales aux interfaces
function drawRaysAndNormals(currentOPL) {
  const rayColor = '#fbbf24';
  const glassRayColor = '#fde047';

  for (let i = 0; i < rays.length; i++) {
    const r = rays[i];
    const isAxis = Math.abs(r.P1.y - axisY) < 1;

    // Apparition de la normale d'entrée quand le rayon atteint le 1er dioptre
    const norm1Alpha = Math.max(0, Math.min(0.85, (currentOPL - (r.t1 - 25)) / 25));
    drawNormal(r.P1, r.N1, norm1Alpha, isAxis);

    // Apparition de la normale de sortie quand le rayon atteint le 2e dioptre
    const norm2Alpha = Math.max(0, Math.min(0.85, (currentOPL - (r.t2 - 25)) / 25));
    drawNormal(r.P2, r.N2, norm2Alpha, isAxis);

    // 1. Rayon incident dans l'air (A -> P1)
    const oplSeg1 = Math.max(0, Math.min(r.L1, currentOPL));
    if (oplSeg1 > 0) {
      const endX1 = A.x + oplSeg1 * r.u1.x;
      const endY1 = A.y + oplSeg1 * r.u1.y;

      ctx.strokeStyle = rayColor;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(endX1, endY1);
      ctx.stroke();

      if (oplSeg1 > r.L1 * 0.55) {
        const midX = A.x + r.L1 * 0.52 * r.u1.x;
        const midY = A.y + r.L1 * 0.52 * r.u1.y;
        drawArrowHead(midX, midY, r.u1.x, r.u1.y, rayColor);
      }
    }

    // 2. Rayon réfracté dans la lentille (P1 -> P2, ralenti par l'indice nGlass)
    if (currentOPL > r.t1) {
      const distGlass = Math.min(r.L2, (currentOPL - r.t1) / nGlass);
      const endX2 = r.P1.x + distGlass * r.u2.x;
      const endY2 = r.P1.y + distGlass * r.u2.y;

      ctx.strokeStyle = glassRayColor;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(r.P1.x, r.P1.y);
      ctx.lineTo(endX2, endY2);
      ctx.stroke();

      if (distGlass > r.L2 * 0.58) {
        const midX = r.P1.x + r.L2 * 0.52 * r.u2.x;
        const midY = r.P1.y + r.L2 * 0.52 * r.u2.y;
        drawArrowHead(midX, midY, r.u2.x, r.u2.y, glassRayColor);
      }
    }

    // 3. Rayon émergent réfracté dans l'air (P2 -> A')
    if (currentOPL > r.t2) {
      const distAir2 = Math.min(r.L3, currentOPL - r.t2);
      const endX3 = r.P2.x + distAir2 * r.u3.x;
      const endY3 = r.P2.y + distAir2 * r.u3.y;

      ctx.strokeStyle = rayColor;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(r.P2.x, r.P2.y);
      ctx.lineTo(endX3, endY3);
      ctx.stroke();

      if (distAir2 > r.L3 * 0.5) {
        const midX = r.P2.x + r.L3 * 0.48 * r.u3.x;
        const midY = r.P2.y + r.L3 * 0.48 * r.u3.y;
        drawArrowHead(midX, midY, r.u3.x, r.u3.y, rayColor);
      }
    }

    // Tête lumineuse du rayon en progression
    if (currentOPL > 0 && currentOPL < r.t3) {
      let tipX, tipY;
      if (currentOPL <= r.t1) {
        tipX = A.x + currentOPL * r.u1.x;
        tipY = A.y + currentOPL * r.u1.y;
      } else if (currentOPL <= r.t2) {
        const dG = (currentOPL - r.t1) / nGlass;
        tipX = r.P1.x + dG * r.u2.x;
        tipY = r.P1.y + dG * r.u2.y;
      } else {
        const dA = currentOPL - r.t2;
        tipX = r.P2.x + dA * r.u3.x;
        tipY = r.P2.y + dA * r.u3.y;
      }

      ctx.save();
      const glow = ctx.createRadialGradient(tipX, tipY, 1, tipX, tipY, 9);
      glow.addColorStop(0, '#ffffff');
      glow.addColorStop(0.4, '#fde047');
      glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(tipX, tipY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// Dessin des points A et A'
function drawPoints(currentOPL) {
  ctx.save();
  ctx.font = '600 22px "Avenir Next", sans-serif';
  ctx.textAlign = 'center';

  // Point objet A
  const glowA = ctx.createRadialGradient(A.x, A.y, 2, A.x, A.y, 18);
  glowA.addColorStop(0, '#ffffff');
  glowA.addColorStop(0.35, '#fbbf24');
  glowA.addColorStop(1, 'rgba(251, 191, 36, 0)');
  ctx.fillStyle = glowA;
  ctx.beginPath();
  ctx.arc(A.x, A.y, 18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(A.x, A.y, 4.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f8fafc';
  ctx.fillText('A', A.x - 24, A.y - 14);

  // Point image A'
  const arrivalProgress = Math.max(0, Math.min(1, (currentOPL - (maxOPL - 20)) / 20));

  if (arrivalProgress > 0.01) {
    const radiusGlow = 12 + 16 * arrivalProgress;
    const glowAp = ctx.createRadialGradient(Ap.x, Ap.y, 2, Ap.x, Ap.y, radiusGlow);
    glowAp.addColorStop(0, `rgba(255, 255, 255, ${arrivalProgress})`);
    glowAp.addColorStop(0.35, `rgba(251, 191, 36, ${0.9 * arrivalProgress})`);
    glowAp.addColorStop(1, 'rgba(251, 191, 36, 0)');
    ctx.fillStyle = glowAp;
    ctx.beginPath();
    ctx.arc(Ap.x, Ap.y, radiusGlow, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = arrivalProgress > 0.5 ? '#ffffff' : '#64748b';
  ctx.beginPath();
  ctx.arc(Ap.x, Ap.y, 4.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = arrivalProgress > 0.5 ? '#f8fafc' : '#94a3b8';
  ctx.fillText("A'", Ap.x + 26, Ap.y - 14);

  ctx.restore();
}

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsedSec = (timestamp - startTime) / 1000;
  const cycleSec = elapsedSec % totalCycleTime;
  const currentOPL = cycleSec * opticalSpeed;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Axe optique
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.18)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(40, axisY);
  ctx.lineTo(1160, axisY);
  ctx.stroke();
  ctx.setLineDash([]);

  drawLensBody();
  drawRaysAndNormals(currentOPL);
  drawPoints(currentOPL);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
