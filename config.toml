baseURL = "http://PresentationsSite.github.io/"
locale = "fr-fr"
title = "Présentations"

theme = "reveal-hugo"

disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
unsafe = true

[outputFormats.Reveal]
baseName = "index"
mediaType = "text/html"
isHTML = true

[markup.highlight]
codeFences = false

[params.reveal_hugo]
theme = "sky"
transition = "concave"
transition_speed  = "fast"
highlight_theme = "github-dark"
line-numbers = true
# reveal.js 5 passe en « scroll view » (défilement vertical des slides)
# sous 435 px de large, donc sur téléphone en portrait. 0 désactive ce mode :
# même navigation bidirectionnelle (gauche/droite, haut/bas) partout.
scroll_activation_width = 0

[security]
  allowContent = ['.*']